<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Free Online Image Resizer
    </title>

    <meta
        name="description"
        content="Resize images online by choosing the exact width and height you need."
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/style.css') }}"
    >
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a
                class="logo"
                href="/"
            >
                Image Tools
            </a>

            <nav>
                <a
                    class="nav-link"
                    href="/converter"
                >
                    Converter
                </a>

                <a
                    class="nav-link"
                    href="/resize"
                >
                    Resizer
                </a>
            </nav>

        </div>
    </header>

    <main class="page-container">

        <div class="tool-page">

            <a
                class="back-link"
                href="/"
            >
                ← Back to Home
            </a>

            <section class="tool-heading">

                <h1>
                    Image Resizer
                </h1>

                <p>
                    Upload an image and choose
                    the new width and height.
                </p>

            </section>

            <section class="converter-box">

                {% if error_message %}

                    <div class="error-message">
                        {{ error_message }}
                    </div>

                {% endif %}

                <form
                    action="/resize"
                    method="post"
                    enctype="multipart/form-data"
                >

                    <div class="form-group">

                        <label for="image">
                            Choose image
                        </label>

                        <input
                            type="file"
                            id="image"
                            name="image"
                            accept="image/*"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="width">
                            Width (pixels)
                        </label>

                        <input
                            type="number"
                            id="width"
                            name="width"
                            min="1"
                            max="10000"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="height">
                            Height (pixels)
                        </label>

                        <input
                            type="number"
                            id="height"
                            name="height"
                            min="1"
                            max="10000"
                            required
                        >

                    </div>

                    <button
                        class="primary-button"
                        type="submit"
                    >
                        Resize Image
                    </button>

                </form>

            </section>

            <section class="info-section">

                <h2>
                    Resize Images Easily
                </h2>

                <p>
                    Choose an image, enter the
                    new width and height and
                    download the resized image.
                </p>

            </section>

        </div>

    </main>

    <footer class="site-footer">
        <div class="footer-inner">

            <p>
                © Image Tools
            </p>

        </div>
    </footer>

</body>

</html>
